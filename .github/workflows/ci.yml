name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ondejogamos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ondejogamos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders only. No access to production services.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ondejogamos_ci?sslmode=disable
      ATTENDANCE_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ondejogamos_ci?sslmode=disable
      BETTER_AUTH_SECRET: ci-only-placeholder-not-for-production-000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migrate disposable test database
        run: npx dbmate --no-dump-schema up
      - name: Test
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
